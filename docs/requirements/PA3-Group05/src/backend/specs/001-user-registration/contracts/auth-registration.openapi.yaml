openapi: 3.1.0
info:
  title: Studitopia Authentication - Registration API
  version: 1.0.0
  description: |
    Contracts for pre-registration validation and account registration.

    Application-level validation failures are returned with the normal HTTP
    status for the operation (200 for validation, 201 for registration) and are
    distinguished by `success: false`. This preserves the existing frontend
    contract.
servers:
  - url: /api/v1
    description: Default global route prefix

paths:
  /auth/validate:
    get:
      summary: Validate one or more registration fields
      description: |
        Checks any supplied registration fields without creating an account.
        Omitted fields are not checked. All failing fields are returned in a
        single field-keyed object.

        The `password` query parameter exists for form pre-checks. Clients
        should avoid placing real passwords in URLs and should prefer validating
        the password during final registration.
      operationId: validateRegistrationFields
      parameters:
        - name: displayname
          in: query
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+([ ][a-zA-Z0-9]+)*$'
        - name: username
          in: query
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-z][a-z0-9]*([.][a-z0-9]+)*$'
        - name: email
          in: query
          required: false
          schema:
            type: string
            maxLength: 254
            format: email
        - name: password
          in: query
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 32
      responses:
        '200':
          description: Validation result; inspect `success` and `data`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidateSuccessEnvelope'
                  - $ref: '#/components/schemas/ValidateFailureEnvelope'
              examples:
                success:
                  value:
                    statusCode: 200
                    success: true
                failure:
                  value:
                    statusCode: 200
                    success: false
                    data:
                      username:
                        - 45003
                      email:
                        - 47001

  /auth/register:
    post:
      summary: Register a new account
      description: |
        Validates every supplied registration field and creates the account
        only when all checks pass. On success, returns the new session.
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              valid:
                value:
                  displayname: Student AB
                  username: student.ab
                  email: student.ab@student.hcmus.edu.vn
                  password: Secure@123456
      responses:
        '201':
          description: Registration result; inspect `success` and `data`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RegisterSuccessEnvelope'
                  - $ref: '#/components/schemas/RegisterFailureEnvelope'
              examples:
                success:
                  value:
                    statusCode: 201
                    success: true
                    data:
                      session_id: '1'
                      user_id: '1'
                      status: 0
                failure:
                  value:
                    statusCode: 201
                    success: false
                    data:
                      - 45003
                      - 46001

components:
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - displayname
        - username
        - email
        - password
      properties:
        displayname:
          type: string
          minLength: 8
          maxLength: 32
          pattern: '^[a-zA-Z0-9]+([ ][a-zA-Z0-9]+)*$'
        username:
          type: string
          minLength: 8
          maxLength: 32
          pattern: '^[a-z][a-z0-9]*([.][a-z0-9]+)*$'
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 32
          description: Must contain lowercase, uppercase, digit, and special characters; must not contain a null character.

    ValidateErrorMap:
      type: object
      additionalProperties: false
      properties:
        displayname:
          type: array
          items:
            $ref: '#/components/schemas/ResponseCode'
        username:
          type: array
          items:
            $ref: '#/components/schemas/ResponseCode'
        email:
          type: array
          items:
            $ref: '#/components/schemas/ResponseCode'
        password:
          type: array
          items:
            $ref: '#/components/schemas/ResponseCode'

    ValidateSuccessEnvelope:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - success
      properties:
        statusCode:
          const: 200
        success:
          const: true
        data:
          description: Omitted when every checked field is valid.

    ValidateFailureEnvelope:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - success
        - data
      properties:
        statusCode:
          const: 200
        success:
          const: false
        data:
          $ref: '#/components/schemas/ValidateErrorMap'

    RegisterSuccessEnvelope:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - success
        - data
      properties:
        statusCode:
          const: 201
        success:
          const: true
        data:
          $ref: '#/components/schemas/SessionResponse'

    RegisterFailureEnvelope:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - success
        - data
      properties:
        statusCode:
          const: 201
        success:
          const: false
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResponseCode'

    SessionResponse:
      type: object
      additionalProperties: false
      required:
        - session_id
        - user_id
        - status
      properties:
        session_id:
          type: string
        user_id:
          type: string
        status:
          type: number
          description: Numeric account/session status owned by the persistence layer.

    ResponseCode:
      type: integer
      enum:
        - 0
        - 2002
        - 40001
        - 45000
        - 45001
        - 45002
        - 45003
        - 45004
        - 46001
        - 47001
        - 47002
      description: |
        0 = SUCCESS
        2002 = UNKNOWN_ERROR
        40001 = VALIDATION_ERROR
        45000 = DATABASE_ERROR
        45001 = INVALID_DISPLAYNAME
        45002 = INVALID_EMAIL
        45003 = INVALID_USERNAME
        45004 = INVALID_PASSWORD
        46001 = UNREGISTED_EMAIL_DOMAIN
        47001 = DUPLICATED_EMAIL
        47002 = DUPLICATED_USERNAME
