openapi: 3.0.3
info:
  title: Studitopia Authentication Session API
  version: 1.0.0
  description: |
    Contract for the login, renewal, and sign-out behavior in feature 002.
    Error response bodies are arrays of numeric response codes, not message objects.

servers:
  - url: /api/v1

paths:
  /auth/login:
    post:
      summary: Sign in with username/email or renew an access token
      description: |
        With `type=username` or `type=email`, verifies the identifier/password pair and
        creates a new independent session. With `type=token`, accepts only the
        HTTP-only refresh cookie and returns a new access token for the same session.

        A suspended account may complete credential verification. The response includes
        the suspended status, but the issued credentials cannot authorize protected
        access or renewal while the account remains suspended.
      operationId: login
      parameters:
        - name: type
          in: query
          required: true
          description: Selects credential login or refresh-token login.
          schema:
            type: string
            enum: [username, email, token]
        - name: refresh_token
          in: cookie
          required: false
          description: Required when `type=token`; ignored for username/email login.
          schema:
            type: string
      requestBody:
        required: false
        description: Required for username/email login; ignored when `type=token`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: |
            Credential login returns access token, role, status, and sets the refresh
            cookie. Refresh login returns only a new access token and does not rotate
            or reset the refresh cookie.
          headers:
            Set-Cookie:
              description: |
                Present for username/email login only. The cookie is HttpOnly, Secure,
                SameSite=None, partitioned, scoped to `/api/v1/auth/login`, and expires
                after the refresh lifetime.
              schema:
                type: string
                example: refresh_token=<token>; Max-Age=2592000; Path=/api/v1/auth/login; HttpOnly; Secure; SameSite=None; Partitioned
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Missing or unsupported `type`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example: [40001]
        '401':
          description: Missing, invalid, expired, or suspended refresh credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example: [40003]
        '409':
          description: Unknown identifier or wrong password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example: [18456]
        '422':
          description: Missing or empty identifier/password for username/email login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example: [40001]

  /auth/logout:
    post:
      summary: End the current access credential
      description: |
        Ends only the current access credential by rotating the session's access
        version. The session remains renewable until its normal expiry, the refresh
        cookie is not cleared, and other sessions are unaffected.

        The request requires a currently valid access credential. An expired,
        malformed, already-ended, or suspended access credential is rejected.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Access credential ended. Empty response body.
        '401':
          description: |
            Missing, malformed, expired, already-ended, or suspended access credential,
            or a database session failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalidAccess:
                  value: [40004]
                invalidSession:
                  value: [45005]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-hmac-token

  schemas:
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          description: Username when `type=username`; email when `type=email`.
        password:
          type: string
          minLength: 1
          format: password
          description: Plain-text password. Never logged or returned.
      additionalProperties: false

    LoginResponse:
      type: object
      required: [access_token, role, status]
      properties:
        access_token:
          type: string
          description: HMAC access credential containing the session access version.
        role:
          type: string
          enum: [STUDENT, STAFF, ADMIN]
        status:
          type: string
          description: Current account status, including INACTIVE, ACTIVE, or SUSPENDED.
      additionalProperties: false

    RefreshResponse:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          description: New access credential for the same session and current access version.
      additionalProperties: false

    ValidationError:
      type: array
      items:
        type: integer
      description: One or more numeric response codes.
